global:
  compatibility:
    openshift:
      # -- Drop `runAsUser`, `runAsGroup` and `fsGroup` from the security contexts so that OpenShift's SCC assigns them from the namespace range (it rejects pods that set others): `auto` when the cluster serves `security.openshift.io/v1`, `force` always, `disabled` never. The valkey subchart adapts itself when it detects OpenShift (`route.openshift.io/v1`); with `force` elsewhere, also set `valkey.targetPlatform: openshift`.
      adaptSecurityContext: auto

# -- Override the chart name (used in resource naming).
nameOverride: ""
# -- Override the full resource name (release-name + chart-name).
fullnameOverride: ""

image:
  # -- SearXNG image registry.
  registry: docker.io
  # -- SearXNG image repository.
  repository: searxng/searxng
  # -- SearXNG image tag. Defaults to the chart appVersion.
  tag: ""
  # -- SearXNG image digest (`sha256:...`). Takes precedence over the tag.
  digest: ""
  # -- SearXNG image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets.
imagePullSecrets: []

# -- SearXNG replicas (ignored with `autoscaling.enabled`). They all share the secret key below.
replicaCount: 1

# -- SearXNG settings, rendered to `/etc/searxng/settings.yml` on top of SearXNG's own defaults: set only what you change. The chart sets `use_default_settings: true`; give it SearXNG's map form to keep or remove default engines (e.g. `use_default_settings.engines.keep_only`). The secret key comes from `secret`. See https://docs.searxng.org/admin/settings/.
settings: {}

# -- Extra files rendered next to `settings.yml` in `/etc/searxng`, by file name (e.g. `limiter.toml`, `favicons.toml`).
extraConfigFiles: {}

secret:
  # -- Existing Secret holding the SearXNG secret key (`server.secret_key`). When empty, the chart creates one with a random key and keeps it across upgrades. Tools that render without cluster access (Argo CD) would generate a new key on every render: give them an existing Secret.
  existingSecret: ""
  # -- Key of the secret key in the Secret.
  key: secret-key

# -- Extra SearXNG environment variables.
env: []
# -- Extra SearXNG environment variables from ConfigMaps or Secrets.
envFrom: []

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 8080
  # -- Service annotations.
  annotations: {}

ingress:
  # -- Expose SearXNG through an Ingress.
  enabled: false
  # -- Ingress class.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress labels.
  labels: {}
  # -- Hosts and paths routed to SearXNG.
  hosts:
  - name: searxng.local
    paths:
    - path: /
      pathType: Prefix
  # -- Ingress TLS (`secretName` and `hosts`).
  tls: []

httpRoute:
  # -- Expose SearXNG through a Gateway API HTTPRoute (needs the gateway.networking.k8s.io CRDs).
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {}
  # -- HTTPRoute labels.
  labels: {}
  # -- Gateways (and listeners) the HTTPRoute attaches to. Required.
  parentRefs: []
  # -- Hostnames the HTTPRoute matches.
  hostnames: []
  # -- Routing rules (`matches`, `filters`), all sent to SearXNG. Empty routes everything to it.
  rules: []

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the fullname, or `default` when not created.
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}
  # -- Mount the ServiceAccount token in the pod. SearXNG never calls the Kubernetes API.
  automount: false

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels.
podLabels: {}

# -- Pod security context (Pod Security `restricted`). 977 is the image's `searxng` user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 977
  runAsGroup: 977
  fsGroup: 977
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (Pod Security `restricted`, read-only root filesystem: SearXNG only writes to an emptyDir on `/tmp`).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

# -- Startup probe: gives the first start up to two minutes without delaying the other probes.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 24
# -- Readiness probe. `/healthz` goes through SearXNG's request setup, so a broken configuration fails it, without rendering a page.
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
# -- Liveness probe.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# -- Resources. One SearXNG worker uses about 130Mi once warm.
resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Deployment strategy.
strategy: {}
# -- Priority class.
priorityClassName: ""
# -- Node selector.
nodeSelector: {}
# -- Affinity.
affinity: {}
# -- Tolerations.
tolerations: []
# -- Topology spread constraints, e.g. one replica per node: `topologyKey: kubernetes.io/hostname` with a `labelSelector` on `app.kubernetes.io/name: searxng` and the release's `app.kubernetes.io/instance`.
topologySpreadConstraints: []

autoscaling:
  # -- Scale SearXNG with a HorizontalPodAutoscaler (needs a metrics server).
  enabled: false
  # -- Minimum replicas.
  minReplicas: 1
  # -- Maximum replicas.
  maxReplicas: 3
  # -- Average CPU utilization target, in percent of the CPU request.
  targetCPUUtilizationPercentage: 80
  # -- Average memory utilization target, in percent of the memory request. Empty by default: an idle worker already sits near its request.
  targetMemoryUtilizationPercentage: ""

pdb:
  # -- Create a PodDisruptionBudget.
  enabled: false
  # -- Pods that must stay available during voluntary disruptions (number or percentage). Exclusive with `maxUnavailable`: set that one to null to use it. With a single replica, `1` blocks node drains.
  minAvailable: ""
  # -- Pods that may be unavailable during voluntary disruptions (number or percentage).
  maxUnavailable: 1

# -- Extra volumes.
extraVolumes: []
# -- Extra volume mounts of the SearXNG container.
extraVolumeMounts: []

valkey:
  # -- Deploy Valkey (the [CloudPirates chart](https://github.com/CloudPirates-io/helm-charts/tree/main/charts/valkey)) and point SearXNG at it: `SEARXNG_VALKEY_URL`, with the password of the Valkey Secret, takes precedence over `settings.valkey.url`. SearXNG needs Valkey for its limiter (`settings.server.limiter`) and bot detection, and connects to it once at startup, so an init container waits for it. Any other key configures the subchart.
  enabled: false
  auth:
    # -- Existing Secret holding the Valkey password (key `auth.existingSecretPasswordKey`). When empty, the subchart creates one with a random password and keeps it across upgrades; tools that render without cluster access (Argo CD) would generate a new one on every render.
    existingSecret: ""
  # -- Valkey pod security context: the subchart's fsGroup plus the seccomp profile Pod Security `restricted` requires.
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  persistence:
    # -- Persist Valkey's data. It only holds SearXNG's limiter counters and cache.
    enabled: false
  # -- Valkey resources (the subchart sets none; quotas and policy engines usually require them).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # The subchart sets no resources on its optional containers either; each uses under 25Mi.
  initContainer:
    # -- Resources of the Valkey init container (`architecture: replication`).
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  metrics:
    # -- Resources of the Valkey metrics exporter (`metrics.enabled`).
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  sentinel:
    # -- Resources of the Valkey sentinel (`sentinel.enabled`).
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    masterProxy:
      # -- Resources of the sentinel's HAProxy master proxy (`sentinel.masterProxy.enabled`).
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

# -- Extra objects to deploy with the release (rendered with `tpl`).
extraObjects: []
