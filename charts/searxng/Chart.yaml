apiVersion: v2
name: searxng
type: application
version: 0.2.1
appVersion: "2026.9.8-3fdc6d753"
description: Secure, plug-and-play Helm chart for SearXNG, the privacy-respecting metasearch engine, with optional Valkey for its limiter.
# Floor set by the APIs the chart renders (autoscaling/v2, policy/v1) and by the `restricted` Pod
# Security Standard the pod is built to meet.
kubeVersion: ">=1.25.0-0"
home: https://github.com/searxng/searxng
deprecated: false
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: added
      description: settingsFromSecrets, to set SearXNG settings such as the metrics password from Secret keys
  artifacthub.io/images: |
    - name: searxng
      image: docker.io/searxng/searxng:2026.9.8-3fdc6d753
    - name: valkey
      image: docker.io/valkey/valkey:9.1.0-alpine3.23@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
keywords:
- searxng
- search
- metasearch
- privacy
- valkey
dependencies:
- name: valkey
  version: 0.25.16
  repository: oci://registry-1.docker.io/cloudpirates
  condition: valkey.enabled
sources:
- https://github.com/this-is-tobi/helm-charts
- https://github.com/searxng/searxng
maintainers:
- name: this-is-tobi
  email: this-is-tobi@proton.me
  url: https://this-is-tobi.com
