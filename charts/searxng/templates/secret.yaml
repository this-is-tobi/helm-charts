{{- if not .Values.secret.existingSecret }}
{{- $name := include "searxng.fullname" . }}
{{- /*
Reuse the key on upgrades: SearXNG signs its sessions and image proxy URLs and encrypts its cache
with it, so a new key would invalidate them.
*/}}
{{- $current := dig "data" .Values.secret.key "" (lookup "v1" "Secret" .Release.Namespace $name | default dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secret.key }}: {{ $current | default (randAlphaNum 64 | b64enc) | quote }}
{{- end }}
