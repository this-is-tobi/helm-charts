{{- /*
Values validation only - renders no resource. Fails at template time on combinations the API server
would accept but SearXNG would not run with.
*/ -}}
{{- if eq (toString (get .Values.settings "use_default_settings")) "false" }}
{{- fail "settings.use_default_settings must stay true (or SearXNG's map form): without it SearXNG takes settings as a complete file and fails on every setting left out" }}
{{- end }}
{{- if hasKey .Values.extraConfigFiles "settings.yml" }}
{{- fail "extraConfigFiles cannot hold settings.yml: the chart renders it from settings" }}
{{- end }}
{{- if and .Values.image.digest (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest)) }}
{{- fail (printf "image.digest must be a full digest such as \"sha256:<64 hex>\", got %q" .Values.image.digest) }}
{{- end }}
{{- if and .Values.httpRoute.enabled (not .Values.httpRoute.parentRefs) }}
{{- fail "httpRoute.enabled requires httpRoute.parentRefs: an HTTPRoute attached to no Gateway is never served" }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.ingress.hosts) }}
{{- fail "ingress.enabled requires at least one host in ingress.hosts" }}
{{- end }}
{{- if and .Values.valkey.enabled (dig "tls" "enabled" false .Values.valkey) }}
{{- fail "valkey.tls.enabled is not supported: SearXNG would also need to trust Valkey's certificate" }}
{{- end }}
