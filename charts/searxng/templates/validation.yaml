{{- /*
Values validation only - renders no resource. Fails at template time on combinations the API server
would accept but SearXNG would not run with.
*/ -}}
{{- if eq (toString (get .Values.settings "use_default_settings")) "false" }}
{{- fail "settings.use_default_settings must stay true (or SearXNG's map form): without it SearXNG takes settings as a complete file and fails on every setting left out" }}
{{- end }}
{{- if hasKey .Values.extraConfigFiles "settings.yml" }}
{{- fail "extraConfigFiles cannot hold settings.yml: the chart renders it from settings" }}
{{- end }}
{{- if and .Values.image.digest (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest)) }}
{{- fail (printf "image.digest must be a full digest such as \"sha256:<64 hex>\", got %q" .Values.image.digest) }}
{{- end }}
{{- if and .Values.httpRoute.enabled (not .Values.httpRoute.parentRefs) }}
{{- fail "httpRoute.enabled requires httpRoute.parentRefs: an HTTPRoute attached to no Gateway is never served" }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.ingress.hosts) }}
{{- fail "ingress.enabled requires at least one host in ingress.hosts" }}
{{- end }}
{{- if and .Values.pdb.enabled (eq (toString .Values.pdb.maxUnavailable) "") (eq (toString .Values.pdb.minAvailable) "") }}
{{- fail "pdb.enabled requires pdb.maxUnavailable or pdb.minAvailable: a budget without either protects nothing" }}
{{- end }}
{{- if and .Values.pdb.enabled (ne (toString .Values.pdb.maxUnavailable) "") (ne (toString .Values.pdb.minAvailable) "") }}
{{- fail "pdb.maxUnavailable and pdb.minAvailable are exclusive: set pdb.maxUnavailable to null to use pdb.minAvailable" }}
{{- end }}
{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) }}
{{- fail "autoscaling.minReplicas cannot exceed autoscaling.maxReplicas" }}
{{- end }}
{{- if and .Values.autoscaling.enabled (not (or .Values.autoscaling.targetCPUUtilizationPercentage .Values.autoscaling.targetMemoryUtilizationPercentage)) }}
{{- fail "autoscaling.enabled requires a CPU or memory utilization target" }}
{{- end }}
{{- $paths := list }}
{{- range .Values.settingsFromSecrets }}
{{- if has .path $paths }}
{{- fail (printf "settingsFromSecrets sets %s twice" .path) }}
{{- end }}
{{- $paths = append $paths .path }}
{{- $value := $.Values.settings }}
{{- range splitList "." .path }}
{{- if kindIs "map" $value }}
{{- $value = get $value . }}
{{- else }}
{{- $value = "" }}
{{- end }}
{{- end }}
{{- if $value }}
{{- fail (printf "settingsFromSecrets sets %s, which settings already sets: keep one, the secret value would silently replace it" .path) }}
{{- end }}
{{- end }}
{{- if and .Values.serviceMonitor.enabled (not (dig "general" "open_metrics" "" .Values.settings)) (not (has "general.open_metrics" $paths)) }}
{{- fail "serviceMonitor.enabled requires settings.general.open_metrics (or settingsFromSecrets for it): SearXNG only serves /metrics with a password" }}
{{- end }}
{{- if and .Values.serviceMonitor.enabled (not (dig "password" "" .Values.serviceMonitor.basicAuth)) }}
{{- fail "serviceMonitor.enabled requires serviceMonitor.basicAuth.password: SearXNG rejects scrapes without the open_metrics password" }}
{{- end }}
{{- if and .Values.valkey.enabled (dig "tls" "enabled" false .Values.valkey) }}
{{- fail "valkey.tls.enabled is not supported: SearXNG would also need to trust Valkey's certificate" }}
{{- end }}
