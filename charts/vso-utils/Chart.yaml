apiVersion: v2
name: vso-utils
type: application
version: 2.1.0
appVersion: "1.6.0"
description: Production-ready Helm chart for managing HashiCorp Vault Secret Operator resources - sync static secrets, generate dynamic credentials, issue PKI certificates, and configure Vault authentication.
deprecated: false
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: changed
      description: Upgrade vault-secrets-operator dependency to 1.6.0
    - kind: fixed
      description: Stop rendering hmacSecretData on VaultDynamicSecret and VaultPKISecret, which do not declare it (rejected under strict or server-side apply)
    - kind: fixed
      description: Honour false for revoke, hmacSecretData and destination.create (always rendered true before)
    - kind: changed
      description: "Upstream breaking (VSO 1.5.0): VaultAuth appRole.secretIDPath is removed, use appRole.secretRef"
    - kind: removed
      description: "Upstream breaking (VSO 1.6.0): HCP Vault Secrets support (HCPAuth, HCPVaultSecretsApp CRDs) is removed from the bundled operator"
keywords:
- vault
- secrets
- hashicorp
- vso
- vault-secrets-operator
- kubernetes
- security
- pki
- dynamic-secrets
dependencies:
- name: vault-secrets-operator
  alias: vso
  version: ">=1.0.0"
  repository: https://helm.releases.hashicorp.com
  condition: vso.enabled
sources:
- https://github.com/this-is-tobi/helm-charts
- https://artifacthub.io/packages/helm/hashicorp/vault-secrets-operator
- https://developer.hashicorp.com/vault/docs/platform/k8s/vso
- https://github.com/hashicorp/vault-secrets-operator
maintainers:
- name: this-is-tobi
  email: this-is-tobi@proton.me
  url: https://this-is-tobi.com

