{{- $defaults := .Values.vaultAuthDefaults | default dict }}
{{- range $authName, $auth := .Values.vaultAuth }}
{{- if include "vso-utils.enabled" (list $ $auth) }}
{{- $method := tpl ($auth.method | default "") $ }}
{{- $mount := tpl ($auth.mount | default "") $ }}
{{- /* The defaults fill what the entry leaves empty, and their mount goes with their method only. */}}
{{- if not (and $method $mount) }}
{{- $defaultMethod := tpl ($defaults.method | default "") $ }}
{{- $method = $method | default $defaultMethod }}
{{- if not $mount }}
{{- if and $defaults.mount $defaultMethod (ne $method $defaultMethod) }}
{{- fail (printf "mount is required for VaultAuth %s: vaultAuthDefaults.mount belongs to the %s method, not %s" $authName $defaultMethod $method) }}
{{- end }}
{{- $mount = tpl ($defaults.mount | default "") $ }}
{{- end }}
{{- end }}
{{- $method = $method | required (printf "method is required for VaultAuth %s" $authName) }}
{{- $mount = $mount | required (printf "mount is required for VaultAuth %s" $authName) }}
{{- if not (has $method (list "kubernetes" "jwt" "appRole" "aws" "gcp")) }}
{{- fail (printf "method %s of VaultAuth %s is not one of kubernetes, jwt, appRole, aws, gcp" $method $authName) }}
{{- end }}
{{- /* With login, only the resolved method's block renders: login, with that block's own keys over it, empty ones too. */}}
{{- $blocks := pick $auth "kubernetes" "jwt" "appRole" "aws" "gcp" }}
{{- with $auth.login }}
{{- if not (has $method (list "kubernetes" "jwt")) }}
{{- fail (printf "login needs the kubernetes or jwt method, not %s, for VaultAuth %s" $method $authName) }}
{{- end }}
{{- $login := deepCopy . }}
{{- range $key, $value := get $auth $method | default dict }}
{{- $_ := set $login $key $value }}
{{- end }}
{{- $blocks = dict $method $login }}
{{- end }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ printf "%s-%s" (include "vso-utils.fullname" $) (include "vso-utils.toKebabCase" $authName) }}
  labels: {{- include "vso-utils.labels" (list $ $authName) | nindent 4 }}
    {{- with $auth.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $auth.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $auth.namespace }}
  namespace: {{ . }}
  {{- end }}
  method: {{ $method }}
  mount: {{ $mount }}
  {{- with $blocks.kubernetes }}
  kubernetes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.jwt }}
  jwt:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.appRole }}
  appRole:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.aws }}
  aws:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.gcp }}
  gcp:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.params }}
  params:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.headers }}
  headers:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.vaultConnectionRef }}
  vaultConnectionRef: {{ . }}
  {{- end }}
  {{- with $auth.vaultAuthGlobalRef }}
  vaultAuthGlobalRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.allowedNamespaces }}
  allowedNamespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.storageEncryption }}
  storageEncryption:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
