{{- range $authName, $auth := .Values.vaultAuth }}
{{- $method := tpl ($auth.method | default $.Values.vaultAuthDefaults.method | default "") $ | required (printf "method is required for VaultAuth %s" $authName) }}
{{- $mount := tpl ($auth.mount | default $.Values.vaultAuthDefaults.mount | default "") $ | required (printf "mount is required for VaultAuth %s" $authName) }}
{{- /* With login, only the resolved method's block renders: login, under that method's own block. */}}
{{- $blocks := pick $auth "kubernetes" "jwt" "appRole" "aws" "gcp" }}
{{- with $auth.login }}
{{- if not (has $method (list "kubernetes" "jwt")) }}
{{- fail (printf "login needs the kubernetes or jwt method, not %s, for VaultAuth %s" $method $authName) }}
{{- end }}
{{- $blocks = dict $method (merge (deepCopy (get $auth $method | default dict)) .) }}
{{- end }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ printf "%s-%s" (include "vso-utils.fullname" $) (include "vso-utils.toKebabCase" $authName) }}
  labels: {{- include "vso-utils.labels" (list $ $authName) | nindent 4 }}
    {{- with $auth.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $auth.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $auth.namespace }}
  namespace: {{ . }}
  {{- end }}
  method: {{ $method }}
  mount: {{ $mount }}
  {{- with $blocks.kubernetes }}
  kubernetes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.jwt }}
  jwt:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.appRole }}
  appRole:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.aws }}
  aws:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $blocks.gcp }}
  gcp:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.params }}
  params:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.headers }}
  headers:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.vaultConnectionRef }}
  vaultConnectionRef: {{ . }}
  {{- end }}
  {{- with $auth.vaultAuthGlobalRef }}
  vaultAuthGlobalRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.allowedNamespaces }}
  allowedNamespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $auth.storageEncryption }}
  storageEncryption:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
