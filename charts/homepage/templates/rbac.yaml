{{- if and .Values.kubernetes.enabled .Values.kubernetes.rbac.create }}
{{- /*
What Homepage reads, from its source: nodes, pods and their metrics (Kubernetes widget, pod status),
ingresses (discovery), and per opt-in the Traefik IngressRoutes (with the CRDs it checks for) or the
Gateway API routes (and the gateways they attach to).
*/}}
{{- $discovery := .Values.config.kubernetes }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "homepage.fullname" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "nodes"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
{{- if $discovery.traefik }}
- apiGroups: ["traefik.io", "traefik.containo.us"]
  resources: ["ingressroutes"]
  verbs: ["get", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions", "customresourcedefinitions/status"]
  verbs: ["get"]
{{- end }}
{{- if $discovery.gateway }}
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes", "gateways"]
  verbs: ["get", "list"]
{{- end }}
{{- with .Values.kubernetes.rbac.extraRules }}
{{- toYaml . | nindent 0 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "homepage.fullname" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "homepage.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "homepage.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
