{{- if and .Values.auth.enabled (not .Values.auth.secret.existingSecret) }}
{{- $name := include "homepage.authSecretName" . }}
{{- /*
Reuse the values on upgrades: a new auth secret signs every session out, and a new password is one
nobody knows.
*/}}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secret.authSecretKey }}: {{ get $current .Values.auth.secret.authSecretKey | default (randAlphaNum 64 | b64enc) | quote }}
  {{ .Values.auth.secret.passwordKey }}: {{ get $current .Values.auth.secret.passwordKey | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
