{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homepage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 3000
    {{- with .Values.networkPolicy.ingress.from }}
    from:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  egress:
  # DNS, wherever the resolver runs (CoreDNS, NodeLocal DNSCache, OpenShift's DNS, which listens on 5353).
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  {{- if .Values.kubernetes.enabled }}
  # The Kubernetes API server: its address depends on the cluster, its port is 443 or 6443.
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  {{- end }}
  {{- with .Values.networkPolicy.egress.rules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
