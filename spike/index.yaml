      artifacthub.io/crds: |
        - kind: Plan
          version: v1
          name: plans.upgrade.cattle.io
          displayName: Plan
          description: A set of nodes to upgrade and how to upgrade them.
      artifacthub.io/crdsExamples: |
        - apiVersion: upgrade.cattle.io/v1
          kind: Plan
          metadata:
            name: server-plan
