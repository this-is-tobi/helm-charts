  - annotations:
      artifacthub.io/category: security
      artifacthub.io/changes: |
        - kind: fixed
          description: "vaultAuthDefaults.mount goes only to entries of the defaults' method: an entry that names another method and no mount fails the render, rather than pairing that method with another one's mount"
        - kind: fixed
          description: "vaultAuthDefaults or vaultStaticSecretDefaults set to null no longer fails the render with a nil pointer"
        - kind: fixed
          description: "the schema accepts an empty method on a VaultAuth entry, which takes vaultAuthDefaults.method as the docs say"
        - kind: fixed
          description: "each key of the method's own block replaces login's, an empty one too"
        - kind: fixed
          description: "a method vaultAuthDefaults resolves to that VaultAuth does not have fails the render, not the apply"
        - kind: fixed
          description: "the README's login example works with the chart installed on its own"
      artifacthub.io/license: MIT
