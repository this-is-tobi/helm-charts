{{- if .Values.enabled }}
{{- if .Values.global.ingress.enabled -}}
{{- $fullNameApp := include "helper.componentFullname" (dict "root" . "componentName" "global") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helper.fullname" . }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "global")) | nindent 4 }}
  {{- if .Values.global.ingress.labels }}
    {{- toYaml .Values.global.ingress.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.global.ingress.annotations }}
  annotations:
    {{- tpl (toYaml .Values.global.ingress.annotations) . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.global.ingress.className }}
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- end }}
  {{- if .Values.global.ingress.tls }}
  tls:
  {{- range .Values.global.ingress.tls }}
  - hosts:
    {{- range .hosts }}
    - {{ . | quote }}
    {{- end }}
    secretName: {{ .secretName | default (printf "%s-%s" $fullNameApp "tls") | quote }}
  {{- end }}
  {{- end }}
  rules:
  {{- range .Values.global.ingress.hosts }}
  - host: {{ .name | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path | default "/" }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
          {{- /* Unlike `servicename.ingress`, this chart-level Ingress fans out to whichever
          component Services the user names, so there is no sensible default backend - refusing to
          render beats emitting a rule that points at a Service the chart never creates. */}}
          {{- if and .backend .backend.serviceName }}
            name: {{ .backend.serviceName }}
            port:
              number: {{ .backend.portNumber | default 80 }}
          {{- else }}
            {{- fail "global.ingress.hosts[].paths[].backend.serviceName is required: the chart-level ingress has no default backend service (use servicename.ingress to route to this chart's own service)" }}
          {{- end }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
