name: Release Charts

# The release is the shared workflows' of this-is-tobi/github-workflows, pinned to a release by commit: chart-releaser
# (the GitHub Releases and the index of the Helm repository, GPG-signed), the push to the OCI registry, then
# the cosign signature and the build provenance of every chart that was pushed.
#
# Signatures made through a shared workflow carry ITS identity, not this repository's: see "Chart Signatures" in the README.

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

# One release at a time: two runs would race for the same index branch and the same tags. A run that is waiting is
# replaced by a newer one, which is safe: chart-releaser releases everything that changed since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: this-is-tobi/github-workflows/.github/workflows/release-helm.yml@9771f8416063599c403c527c84a03b2731c2f701 # v0.48.0
    permissions:
      contents: write
      packages: write
    with:
      CHARTS_DIR: charts
      CREATE_GITHUB_RELEASE: true
      # The index goes to a branch no site serves, so the Helm repository at github.io stays online, frozen at the last
      # version it lists. The branch starts as a copy of gh-pages, which keeps the index's history.
      PAGES_BRANCH: charts-index
      PUBLISH_OCI: true
      # Every chart of this-is-tobi lives at ghcr.io/this-is-tobi/charts/<chart>; ghcr.io/this-is-tobi/helm-charts/<chart>
      # keeps the first versions, frozen. They were copied here by digest first, which keeps SKIP_EXISTING safe: it looks
      # at the destination, and a chart pushed again would change what its version means.
      REPOSITORY: this-is-tobi/charts
      # A merge that changes a chart without releasing it (a README, a comment) is not a failed release.
      SKIP_EXISTING: true
      SIGN_CHART: true
      SIGNING_KEY_ID: "Tobi (Helm Charts) <this-is-tobi@proton.me>"
      # What the charts' dependencies need (vso-utils); the OCI ones (searxng) need none.
      HELM_REPOS: hashicorp=https://helm.releases.hashicorp.com
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Nothing to attest (an empty list) is a no-op, so this runs on every release, a failed one included: the charts
  # pushed before the failure are listed, and a later run leaves them out as already published.
  attest:
    needs: release
    if: ${{ !cancelled() }}
    uses: this-is-tobi/github-workflows/.github/workflows/attest-helm.yml@9771f8416063599c403c527c84a03b2731c2f701 # v0.48.0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      CHARTS: ${{ needs.release.outputs.published-charts }}
      SIGN: true
      PROVENANCE: true
