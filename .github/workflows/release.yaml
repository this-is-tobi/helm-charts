name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC authentication with Sigstore/Cosign
    steps:
      - name: Checks-out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add hashicorp https://helm.releases.hashicorp.com

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --no-tty
          gpg --list-secret-keys
          
          # Export keys in legacy GPG format for Helm compatibility
          # Per Helm docs: https://helm.sh/docs/topics/provenance/
          # GPG 2.1+ uses new format (kbx), but Helm requires legacy format with separate files:
          # - pubring.gpg: public keys only
          # - secring.gpg: secret keys only
          gpg --batch --yes --export > "$HOME/.gnupg/pubring.gpg"
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --export-secret-keys > "$HOME/.gnupg/secring.gpg"
          
          # Verify files were created
          ls -la "$HOME/.gnupg/"
          
          # Create passphrase file for helm signing
          echo "${{ secrets.GPG_PASSPHRASE }}" > /tmp/passphrase.txt
          chmod 600 /tmp/passphrase.txt

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        id: chart-releaser
        with:
          charts_dir: charts
          config: ci/configs/cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_KEY: "Tobi (Helm Charts) <this-is-tobi@proton.me>"
          CR_KEYRING: ~/.gnupg/secring.gpg
          CR_PASSPHRASE_FILE: /tmp/passphrase.txt
          CR_SIGN: "true"

      - name: Login to GitHub Container Registry
        if: steps.chart-releaser.outputs.changed_charts != ''
        run: |
          # Login with Helm for pushing charts
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # Also login with Docker for Cosign (which uses Docker credentials)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign for OCI signing
        if: steps.chart-releaser.outputs.changed_charts != ''
        uses: sigstore/cosign-installer@v4.1.0

      - name: Publish and sign charts to OCI registry
        if: steps.chart-releaser.outputs.changed_charts != ''
        env:
          COSIGN_EXPERIMENTAL: 1
          OCI_REPO: oci://ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          # nullglob so an unmatched pattern yields an empty array rather than
          # the literal glob string. The previous `[ ! -f ... ] && continue`
          # form turned that into a green run that published nothing, even
          # though this step only runs when chart-releaser reported changed
          # charts - so an empty set is an anomaly, not something to skip past.
          shopt -s nullglob
          chart_packages=(.cr-release-packages/*.tgz)

          if [ ${#chart_packages[@]} -eq 0 ]; then
            echo "::error::chart-releaser reported changed charts but produced no package in .cr-release-packages"
            exit 1
          fi

          for chart_package in "${chart_packages[@]}"; do
            chart_file=$(basename "$chart_package")

            # Push to GHCR (skip if already exists)
            echo "Publishing ${chart_file} to OCI registry..."
            if output=$(helm push "$chart_package" "$OCI_REPO" 2>&1); then
              echo "$output"

              # Read the reference and digest back from helm's own output
              # rather than rebuilding them from the file name: stripping the
              # version with `${chart_file%-*}` breaks on any prerelease
              # version, where the last dash belongs to the identifier
              # (my-chart-1.2.3-rc.1.tgz would have signed 'my-chart-1.2.3').
              reference=$(printf '%s\n' "$output" | awk '/^Pushed:/ { print $2 }')
              digest=$(printf '%s\n' "$output" | awk '/^Digest:/ { print $2 }')

              # An unsigned chart must never be reported as signed. Without
              # this the empty-digest case reached `cosign sign ...@` and the
              # loop still printed the success line, because a failing cosign
              # was not fatal either.
              if [ -z "$reference" ] || [ -z "$digest" ]; then
                echo "::error::could not read the reference and digest of ${chart_file} back from helm push"
                exit 1
              fi

              echo "Signing ${reference%:*}@${digest}"
              cosign sign --yes "${reference%:*}@${digest}"

              echo "✓ Published and signed ${chart_file}"
            elif echo "$output" | grep -q "already exists\|409"; then
              echo "⊘ ${chart_file} already exists in OCI registry, skipping"
            else
              echo "✗ Failed to push ${chart_file}"
              echo "$output"
              exit 1
            fi
          done
