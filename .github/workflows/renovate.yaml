name: Renovate post-upgrade

# Renovate bumps the version of a chart, but cannot write what derives from the change: the Artifact Hub
# changes of the new version, the images annotation, and the README.md that helm-docs generates. This job adds
# them to the pull request in one commit, so that it passes the same checks as any other.
#
# The job pushes with a GitHub App token, not with the token of the workflow: a push with GITHUB_TOKEN starts no
# checks of the pull request (or holds them until someone approves them), while the push of an App starts them
# like the one of Renovate itself. Renovate keeps rebasing the branch: it ignores the commits of
# github-actions[bot] (gitIgnoredAuthors in renovate.json), and the job runs again on the new commit, finds
# nothing to update and stops.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'ci/scripts/helm-docs.sh'

permissions: {}

concurrency:
  group: renovate-post-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  post-upgrade:
    name: Update the chart changes and docs
    # The branches of Renovate in this repository only: the pull request of a fork never reaches the write token.
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No credential is left in the git config: the scripts below run from the branch, and only the push gets one.
      - name: Checks-out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The title of the pull request is data from a bot's branch: it only reaches the script as a variable.
      - name: Update the Artifact Hub changes and images
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./ci/scripts/renovate-post-upgrade.sh

      - name: Regenerate the docs
        run: ./ci/scripts/helm-docs.sh

      - name: Commit the result
        id: commit
        run: |
          set -euo pipefail

          # Tracked files only: nothing the job left in the working tree is committed.
          git add -u -- charts template
          if git diff --cached --quiet; then
            echo "Nothing to update"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: update the chart changes and docs"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Minted once the commit exists, and only for what the push writes.
      - name: Generate GitHub App token
        id: app-token
        if: steps.commit.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the commit to the branch
        if: steps.commit.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
