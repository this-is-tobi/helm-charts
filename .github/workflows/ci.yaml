name: Lint and Test Charts

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'charts/**'
      - 'template/**'
      - 'ci/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  lint-chart:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint and test chart
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
            
      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add hashicorp https://helm.releases.hashicorp.com

      - name: Run chart-testing (lint)
        run: ct lint --config ./ci/configs/chart-testing.yaml

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Run chart-testing (install)
        run: ct install --config ./ci/configs/chart-testing.yaml

      # Beyond ct's install/readiness check: restricted Pod Security admission, Plan validation
      # against the real CRD, and one full no-op upgrade Job (cordon, run, uncordon).
      - name: Run system-upgrade-controller e2e
        run: |
          if ct list-changed --config ./ci/configs/chart-testing.yaml | grep -qx 'charts/system-upgrade-controller'; then
            ./ci/scripts/test-system-upgrade-controller.sh --e2e
          fi

      # Beyond ct's install/readiness check: restricted Pod Security admission, an OpenShift-like
      # arbitrary UID, the secret key across upgrades, and valkey with SearXNG waiting for it at startup.
      - name: Run searxng e2e
        run: |
          if ct list-changed --config ./ci/configs/chart-testing.yaml | grep -qx 'charts/searxng'; then
            ./ci/scripts/test-searxng.sh --e2e
          fi

      # Beyond ct's install/readiness check: restricted Pod Security admission, host validation, an
      # OpenShift-like arbitrary UID, service discovery through the chart's RBAC, and the authentication gate.
      - name: Run homepage e2e
        run: |
          if ct list-changed --config ./ci/configs/chart-testing.yaml | grep -qx 'charts/homepage'; then
            ./ci/scripts/test-homepage.sh --e2e
          fi

  lint-template:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint and render template chart
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The scaffold chart is intentionally left out of chart-testing (it ships no maintainers and
      # is never released), so it gets its own render + schema-validation pass here instead of
      # going unchecked.
      - name: Run template chart checks
        run: ./ci/scripts/test-template.sh

  test-system-upgrade-controller:
    if: ${{ !github.event.pull_request.draft }}
    name: Test system-upgrade-controller chart
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run chart checks
        run: ./ci/scripts/test-system-upgrade-controller.sh

  test-searxng:
    if: ${{ !github.event.pull_request.draft }}
    name: Test searxng chart
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run chart checks
        run: ./ci/scripts/test-searxng.sh

  test-homepage:
    if: ${{ !github.event.pull_request.draft }}
    name: Test homepage chart
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run chart checks
        run: ./ci/scripts/test-homepage.sh

  lint-docs:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run helm-docs
        run: ./ci/scripts/helm-docs.sh

  test-renovate:
    if: ${{ !github.event.pull_request.draft }}
    name: Test Renovate post-upgrade script
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run script checks
        run: ./ci/scripts/test-renovate-post-upgrade.sh
